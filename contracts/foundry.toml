[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Robinhood Chain (Arbitrum Nitro) supports PUSH0 / TLOAD / MCOPY (probed via eth_call on 4663).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Tests that read the live Robinhood Chain need the internet, so the normal `forge test`
# skips them. Run them on request with:  FOUNDRY_PROFILE=fork forge test -vv
no_match_path = "test/fork/*"

[profile.fork]
match_path = "test/fork/*"
no_match_path = "none/*"

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
